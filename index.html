<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irvao.com.br</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6862; --line:#e4e0d8; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --ink:#f0eee8; --muted:#9a968d; --line:#2e2d2a; --accent:#fb923c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2.2rem; margin:0 0 4px; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  p.sub { color:var(--muted); margin:0 0 40px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.card { display:flex; gap:16px; align-items:center; padding:18px 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .ico { font-size:1.8rem; width:44px; text-align:center; flex:none; }
  .t { font-weight:600; }
  .d { color:var(--muted); font-size:.92rem; }
  footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>irvao<span>.com.br</span></h1>
  <p class="sub">Projetos e ferramentas do Irving.</p>
  <ul>
    <li><a class="card" href="/inventario/"><div class="ico">📦</div><div><div class="t">Inventário</div><div class="d">Onde está cada coisa da casa, com fotos.</div></div></a></li>
    <li><a class="card" href="/churrascometro/"><div class="ico">🔥</div><div><div class="t">Churrascômetro</div><div class="d">Quanto comprar de carne, bebida e carvão.</div></div></a></li>
    <li><a class="card" href="/jogo/"><div class="ico">🎲</div><div><div class="t">Jogo</div><div class="d">Ficha de personagem estilo RPG.</div></div></a></li>
  </ul>
  <footer>irvao.com.br</footer>
</main>
</body>
</html>
